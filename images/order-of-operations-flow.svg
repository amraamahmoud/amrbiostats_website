<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="210" viewBox="0 0 1480 210" role="img" aria-labelledby="title desc">
  <title id="title">Order of mathematical operations</title>
  <desc id="desc">Flowchart showing parentheses, exponents, multiplication and division, then addition and subtraction.</desc>
  <defs>
    <linearGradient id="amrBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2168c8"/>
      <stop offset="1" stop-color="#0466c8"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0249ab" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0466c8"/>
    </marker>
  </defs>

  <rect width="1480" height="210" fill="#ffffff"/>

  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="25" text-anchor="middle">
    <line x1="250" y1="105" x2="335" y2="105" stroke="#0466c8" stroke-width="2.2" marker-end="url(#arrowHead)"/>
    <line x1="555" y1="105" x2="630" y2="105" stroke="#0466c8" stroke-width="2.2" marker-end="url(#arrowHead)"/>
    <line x1="985" y1="105" x2="1065" y2="105" stroke="#0466c8" stroke-width="2.2" marker-end="url(#arrowHead)"/>

    <g filter="url(#softShadow)">
      <rect x="30" y="70" width="220" height="70" rx="8" fill="url(#amrBlue)"/>
      <text x="140" y="113" fill="#ffffff">Parentheses (P)</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="340" y="70" width="215" height="70" rx="8" fill="url(#amrBlue)"/>
      <text x="447.5" y="113" fill="#ffffff">Exponents (E)</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="635" y="52" width="350" height="106" rx="8" fill="url(#amrBlue)"/>
      <text x="810" y="93" fill="#ffffff">
        <tspan x="810" dy="0">Multiplication and Division</tspan>
        <tspan x="810" dy="36">(MD)</tspan>
      </text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="1070" y="52" width="380" height="106" rx="8" fill="url(#amrBlue)"/>
      <text x="1260" y="93" fill="#ffffff">
        <tspan x="1260" dy="0">Addition and Subtraction</tspan>
        <tspan x="1260" dy="36">(AS)</tspan>
      </text>
    </g>
  </g>
</svg>
